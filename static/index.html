<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Automation Registry</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: white;
      padding: 2rem;
    }
    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0.55;
    }
    svg.puzzle {
      max-width: min(740px, 100%);
      height: auto;
      filter: drop-shadow(0 8px 32px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>

  <h1>Network Automation Registry</h1>

  <!--
    Puzzle grid: 3 cols × 2 rows, each cell 220×160.
    Tab protrusion: 24px. Tab arc half-width: 40px.

    Tab/notch convention per edge:
      Row 0: right tabs → row 1 top notches (y boundary 160, tabs extend to y=184)
      Col separations: left col right tabs → right col left notches (x tabs extend 24px)

    Piece centers (for labels/icons):
      PRESENTATION  (110, 80)   OBSERVABILITY (330, 80)   ORCHESTRATION (550, 80)
      INTENT        (110, 240)  COLLECTOR     (330, 240)  EXECUTOR      (550, 240)
  -->
  <svg class="puzzle" viewBox="-3 -3 666 326" xmlns="http://www.w3.org/2000/svg">

    <!-- ─────────────────── PRESENTATION – orange ─────────────────── -->
    <path d="
      M 0 0 L 220 0
      L 220 40 Q 244 40 244 80 Q 244 120 220 120
      L 220 160
      L 150 160 Q 150 184 110 184 Q 70 184 70 160
      L 0 160 Z"
      fill="#E07830" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- monitor icon -->
    <rect x="95" y="51" width="30" height="20" rx="2" fill="none" stroke="white" stroke-width="2"/>
    <line x1="110" y1="71" x2="110" y2="78" stroke="white" stroke-width="2"/>
    <line x1="103" y1="78" x2="117" y2="78" stroke="white" stroke-width="2"/>
    <text x="110" y="107" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="12"
      fill="white" letter-spacing="1.5">PRESENTATION</text>

    <!-- ─────────────────── OBSERVABILITY – green ─────────────────── -->
    <path d="
      M 220 0 L 440 0
      L 440 40 Q 464 40 464 80 Q 464 120 440 120
      L 440 160
      L 370 160 Q 370 184 330 184 Q 290 184 290 160
      L 220 160
      L 220 120 Q 244 120 244 80 Q 244 40 220 40 Z"
      fill="#4EA64E" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- magnifying glass icon -->
    <circle cx="327" cy="59" r="10" fill="none" stroke="white" stroke-width="2"/>
    <line x1="334" y1="67" x2="344" y2="77" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <text x="330" y="107" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="12"
      fill="white" letter-spacing="1.5">OBSERVABILITY</text>

    <!-- ─────────────────── ORCHESTRATION – blue ─────────────────── -->
    <path d="
      M 440 0 L 660 0
      L 660 160
      L 590 160 Q 590 184 550 184 Q 510 184 510 160
      L 440 160
      L 440 120 Q 464 120 464 80 Q 464 40 440 40 Z"
      fill="#4A85CA" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- branch / topology icon -->
    <line x1="550" y1="49" x2="550" y2="59" stroke="white" stroke-width="2"/>
    <line x1="550" y1="59" x2="541" y2="69" stroke="white" stroke-width="2"/>
    <line x1="550" y1="59" x2="559" y2="69" stroke="white" stroke-width="2"/>
    <circle cx="550" cy="46" r="4" fill="white"/>
    <circle cx="539" cy="72" r="4" fill="white"/>
    <circle cx="561" cy="72" r="4" fill="white"/>
    <text x="550" y="107" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="12"
      fill="white" letter-spacing="1.5">ORCHESTRATION</text>

    <!-- ─────────────────── INTENT – golden ─────────────────── -->
    <path d="
      M 0 160
      L 70 160 Q 70 184 110 184 Q 150 184 150 160
      L 220 160
      L 220 200 Q 244 200 244 240 Q 244 280 220 280
      L 220 320 L 0 320 Z"
      fill="#CC8820" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- diamond icon -->
    <polygon points="110,217 122,232 110,247 98,232"
      fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    <text x="110" y="274" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="12"
      fill="white" letter-spacing="1.5">INTENT</text>

    <!-- ─────────────────── COLLECTOR – dark red ─────────────────── -->
    <path d="
      M 220 160
      L 290 160 Q 290 184 330 184 Q 370 184 370 160
      L 440 160
      L 440 200 Q 464 200 464 240 Q 464 280 440 280
      L 440 320 L 220 320
      L 220 280 Q 244 280 244 240 Q 244 200 220 200 Z"
      fill="#882035" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- pine tree icon -->
    <polygon points="330,214 341,233 319,233" fill="white"/>
    <polygon points="330,224 344,246 316,246" fill="white"/>
    <rect x="327" y="246" width="6" height="8" fill="white"/>
    <text x="330" y="274" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="12"
      fill="white" letter-spacing="1.5">COLLECTOR</text>

    <!-- ─────────────────── EXECUTOR – purple ─────────────────── -->
    <path d="
      M 440 160
      L 510 160 Q 510 184 550 184 Q 590 184 590 160
      L 660 160
      L 660 320 L 440 320
      L 440 280 Q 464 280 464 240 Q 464 200 440 200 Z"
      fill="#7755AA" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- double chevron down -->
    <polyline points="543,222 550,233 557,222"
      fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="543,235 550,246 557,235"
      fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="550" y="274" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="12"
      fill="white" letter-spacing="1.5">EXECUTOR</text>

  </svg>

</body>
</html>
