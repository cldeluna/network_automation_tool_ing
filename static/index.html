<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Automation Registry</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 2rem;
    }

    h1 {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      color: rgba(255,255,255,0.45);
    }

    svg.puzzle {
      max-width: min(760px, 100%);
      height: auto;
      filter: drop-shadow(0 8px 32px rgba(0,0,0,0.55));
    }

    /* ── puzzle foreignObject content ── */
    .tool-list {
      overflow-y: auto;
      height: 100%;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.25) transparent;
    }
    .tool-list::-webkit-scrollbar { width: 4px; }
    .tool-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 2px; }
    .tool-list ul { list-style: none; padding: 0; margin: 0; }
    .tool-list li {
      font-size: 10.5px;
      line-height: 1.55;
      color: rgba(255,255,255,0.88);
      padding: 1px 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Segoe UI', Arial, sans-serif;
      border-radius: 3px;
      cursor: pointer;
    }
    .tool-list li:hover { background: rgba(255,255,255,0.18); }
    .tool-loading {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      padding: 3px 5px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-style: italic;
    }
    .tool-count { font-size: 9px; fill: rgba(255,255,255,0.45); font-family: 'Segoe UI', Arial, sans-serif; }

    /* ── detail panel ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 90;
    }
    #overlay.open { display: block; }

    #detail-panel {
      position: fixed;
      top: 0;
      right: -440px;
      width: 420px;
      max-width: 100vw;
      height: 100vh;
      background: #1e293b;
      border-left: 1px solid rgba(255,255,255,0.1);
      overflow-y: auto;
      z-index: 100;
      transition: right 0.22s ease;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    #detail-panel.open { right: 0; }

    #detail-close {
      position: sticky;
      top: 0;
      float: right;
      margin: 14px 16px 0 0;
      background: rgba(255,255,255,0.08);
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 18px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      line-height: 30px;
      text-align: center;
      z-index: 1;
    }
    #detail-close:hover { background: rgba(255,255,255,0.18); color: white; }

    #detail-content { padding: 20px 20px 32px; color: white; }

    .detail-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge-type     { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); }
    .badge-status   { background: #166534; color: #86efac; }
    .badge-status.deprecated { background: #713f12; color: #fde68a; }
    .badge-status.archived   { background: #374151; color: #9ca3af; }
    .badge-status.experimental { background: #1e3a5f; color: #93c5fd; }

    .detail-name {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .detail-desc {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.65);
      line-height: 1.55;
      margin-bottom: 14px;
    }

    .detail-links { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .detail-links a {
      font-size: 0.78rem;
      color: #60a5fa;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .detail-links a:hover { text-decoration: underline; }

    .detail-section { margin-bottom: 16px; }
    .detail-section h3 {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .badge-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .badge-naf  { color: white; font-size: 10px; font-weight: 600; padding: 2px 9px; border-radius: 12px; }
    .badge-naf.presentation  { background: #E07830; }
    .badge-naf.observability { background: #4EA64E; }
    .badge-naf.orchestration { background: #4A85CA; }
    .badge-naf.intent        { background: #CC8820; }
    .badge-naf.collector     { background: #882035; }
    .badge-naf.executor      { background: #7755AA; }
    .badge-naf.infrastructure{ background: #4b5563; }

    .badge-cat {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.75);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
    }
    .badge-proto {
      background: #0f3460;
      color: #7dd3fc;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .badge-os {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.6);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .capability-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px;
      padding: 9px 11px;
      margin-bottom: 7px;
    }
    .cap-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      margin-bottom: 6px;
    }
    .cap-notes {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.45);
      margin-top: 5px;
      font-style: italic;
      line-height: 1.45;
    }

    .detail-field {
      display: flex;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .field-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      min-width: 90px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .field-value { font-size: 0.8rem; color: rgba(255,255,255,0.75); }

    .detail-spinner {
      padding: 40px 20px;
      text-align: center;
      color: rgba(255,255,255,0.35);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h1>Network Automation Registry</h1>

  <svg class="puzzle" viewBox="-3 -3 666 326" xmlns="http://www.w3.org/2000/svg">

    <!-- PRESENTATION – orange -->
    <path d="M 0 0 L 220 0
             L 220 40 Q 244 40 244 80 Q 244 120 220 120
             L 220 160
             L 150 160 Q 150 184 110 184 Q 70 184 70 160
             L 0 160 Z"
      fill="#E07830" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="110" y="20" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="11.5"
      fill="white" letter-spacing="1.8">PRESENTATION</text>
    <line x1="18" y1="27" x2="202" y2="27" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    <text class="tool-count" x="110" y="155" text-anchor="middle" id="count-presentation"/>
    <foreignObject x="12" y="32" width="195" height="112">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tool-list" id="tools-presentation">
        <div class="tool-loading">loading…</div>
      </div>
    </foreignObject>

    <!-- OBSERVABILITY – green -->
    <path d="M 220 0 L 440 0
             L 440 40 Q 464 40 464 80 Q 464 120 440 120
             L 440 160
             L 370 160 Q 370 184 330 184 Q 290 184 290 160
             L 220 160
             L 220 120 Q 244 120 244 80 Q 244 40 220 40 Z"
      fill="#4EA64E" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="330" y="20" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="11.5"
      fill="white" letter-spacing="1.8">OBSERVABILITY</text>
    <line x1="238" y1="27" x2="422" y2="27" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    <text class="tool-count" x="330" y="155" text-anchor="middle" id="count-observability"/>
    <foreignObject x="252" y="32" width="178" height="112">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tool-list" id="tools-observability">
        <div class="tool-loading">loading…</div>
      </div>
    </foreignObject>

    <!-- ORCHESTRATION – blue -->
    <path d="M 440 0 L 660 0
             L 660 160
             L 590 160 Q 590 184 550 184 Q 510 184 510 160
             L 440 160
             L 440 120 Q 464 120 464 80 Q 464 40 440 40 Z"
      fill="#4A85CA" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="550" y="20" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="11.5"
      fill="white" letter-spacing="1.8">ORCHESTRATION</text>
    <line x1="458" y1="27" x2="642" y2="27" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    <text class="tool-count" x="550" y="155" text-anchor="middle" id="count-orchestration"/>
    <foreignObject x="468" y="32" width="182" height="112">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tool-list" id="tools-orchestration">
        <div class="tool-loading">loading…</div>
      </div>
    </foreignObject>

    <!-- INTENT – golden -->
    <path d="M 0 160
             L 70 160 Q 70 184 110 184 Q 150 184 150 160
             L 220 160
             L 220 200 Q 244 200 244 240 Q 244 280 220 280
             L 220 320 L 0 320 Z"
      fill="#CC8820" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="110" y="180" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="11.5"
      fill="white" letter-spacing="1.8">INTENT</text>
    <line x1="18" y1="187" x2="202" y2="187" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    <text class="tool-count" x="110" y="315" text-anchor="middle" id="count-intent"/>
    <foreignObject x="12" y="192" width="195" height="112">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tool-list" id="tools-intent">
        <div class="tool-loading">loading…</div>
      </div>
    </foreignObject>

    <!-- COLLECTOR – dark red -->
    <path d="M 220 160
             L 290 160 Q 290 184 330 184 Q 370 184 370 160
             L 440 160
             L 440 200 Q 464 200 464 240 Q 464 280 440 280
             L 440 320 L 220 320
             L 220 280 Q 244 280 244 240 Q 244 200 220 200 Z"
      fill="#882035" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="330" y="180" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="11.5"
      fill="white" letter-spacing="1.8">COLLECTOR</text>
    <line x1="238" y1="187" x2="422" y2="187" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    <text class="tool-count" x="330" y="315" text-anchor="middle" id="count-collector"/>
    <foreignObject x="252" y="192" width="178" height="112">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tool-list" id="tools-collector">
        <div class="tool-loading">loading…</div>
      </div>
    </foreignObject>

    <!-- EXECUTOR – purple -->
    <path d="M 440 160
             L 510 160 Q 510 184 550 184 Q 590 184 590 160
             L 660 160
             L 660 320 L 440 320
             L 440 280 Q 464 280 464 240 Q 464 200 440 200 Z"
      fill="#7755AA" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="550" y="180" text-anchor="middle"
      font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="11.5"
      fill="white" letter-spacing="1.8">EXECUTOR</text>
    <line x1="458" y1="187" x2="642" y2="187" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
    <text class="tool-count" x="550" y="315" text-anchor="middle" id="count-executor"/>
    <foreignObject x="468" y="192" width="182" height="112">
      <div xmlns="http://www.w3.org/1999/xhtml" class="tool-list" id="tools-executor">
        <div class="tool-loading">loading…</div>
      </div>
    </foreignObject>

  </svg>

  <!-- detail panel -->
  <div id="overlay"></div>
  <div id="detail-panel">
    <button id="detail-close" title="Close">×</button>
    <div id="detail-content"><div class="detail-spinner">Loading…</div></div>
  </div>

  <script>
    const NAF_FUNCTIONS = ["presentation","observability","orchestration","intent","collector","executor"];

    // ── fetch all tools (one shot, max 100) ──────────────────────────────
    async function fetchAllTools() {
      const res  = await fetch("/api/v1/tools?per_page=100&page=1");
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const json = await res.json();
      let tools  = json.data;
      for (let p = 2; p <= json.meta.pages; p++) {
        const r = await fetch(`/api/v1/tools?per_page=100&page=${p}`);
        tools = tools.concat((await r.json()).data);
      }
      return tools;
    }

    // ── group tools by naf_function ──────────────────────────────────────
    function groupByFunction(tools) {
      const groups = {};
      for (const fn of NAF_FUNCTIONS) groups[fn] = [];
      for (const tool of tools) {
        for (const fn of (tool.naf_functions || [])) {
          if (fn in groups) groups[fn].push({ name: tool.name, slug: tool.slug });
        }
      }
      for (const fn of NAF_FUNCTIONS) groups[fn].sort((a, b) => a.name.localeCompare(b.name));
      return groups;
    }

    // ── render list into a puzzle piece ─────────────────────────────────
    function renderGroup(fn, items) {
      const container = document.getElementById(`tools-${fn}`);
      const counter   = document.getElementById(`count-${fn}`);
      if (!container) return;

      if (items.length === 0) {
        container.innerHTML = '<div class="tool-loading">—</div>';
        return;
      }
      const ul = document.createElement("ul");
      for (const { name, slug } of items) {
        const li = document.createElement("li");
        li.textContent = name;
        li.title = name;
        li.dataset.slug = slug;
        li.addEventListener("click", () => openDetail(slug, name));
        ul.appendChild(li);
      }
      container.innerHTML = "";
      container.appendChild(ul);
      if (counter) counter.textContent = `${items.length} tool${items.length !== 1 ? "s" : ""}`;
    }

    // ── detail panel ─────────────────────────────────────────────────────
    const panel   = document.getElementById("detail-panel");
    const overlay = document.getElementById("overlay");
    const content = document.getElementById("detail-content");

    function closeDetail() {
      panel.classList.remove("open");
      overlay.classList.remove("open");
    }
    document.getElementById("detail-close").addEventListener("click", closeDetail);
    overlay.addEventListener("click", closeDetail);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

    async function openDetail(slug, fallbackName) {
      panel.classList.add("open");
      overlay.classList.add("open");
      content.innerHTML = `<div class="detail-spinner">Loading ${fallbackName}…</div>`;

      try {
        const res  = await fetch(`/api/v1/tools/${slug}`);
        if (!res.ok) throw new Error(`${res.status}`);
        const { data: tool } = await res.json();
        content.innerHTML = buildDetailHTML(tool);
      } catch (err) {
        content.innerHTML = `<div class="detail-spinner" style="color:#f87171">Failed to load details.</div>`;
      }
    }

    const NAF_COLORS = {
      presentation: "#E07830", observability: "#4EA64E", orchestration: "#4A85CA",
      intent: "#CC8820", collector: "#882035", executor: "#7755AA", infrastructure: "#4b5563",
    };

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
    }

    function buildDetailHTML(t) {
      const statusCls = { active:"", deprecated:" deprecated", archived:" archived", experimental:" experimental" }[t.status] ?? "";

      // links
      let links = "";
      if (t.homepage_url) links += `<a href="${esc(t.homepage_url)}" target="_blank" rel="noopener">🌐 Homepage</a>`;
      if (t.repo_url)     links += `<a href="${esc(t.repo_url)}"     target="_blank" rel="noopener">⌨ Repository</a>`;

      // naf function badges
      const nafBadges = (t.naf_functions || []).map(fn =>
        `<span class="badge badge-naf ${fn}" style="background:${NAF_COLORS[fn]||'#555'}">${fn}</span>`
      ).join("");

      // category badges
      const catBadges = (t.categories || []).map(c =>
        `<span class="badge badge-cat">${esc(c)}</span>`
      ).join("");

      // capabilities
      let capsHTML = "";
      for (const cap of (t.capabilities || [])) {
        const protos = (cap.protocol_support || []).map(p => `<span class="badge badge-proto">${esc(p)}</span>`).join("");
        const oses   = (cap.os_support || []).map(o => `<span class="badge badge-os">${esc(o)}</span>`).join("");
        const notes  = cap.notes ? `<div class="cap-notes">${esc(cap.notes)}</div>` : "";
        capsHTML += `
          <div class="capability-block">
            <div class="cap-name">${esc(cap.capability)}</div>
            ${protos ? `<div class="badge-tags" style="margin-bottom:4px">${protos}</div>` : ""}
            ${oses   ? `<div class="badge-tags">${oses}</div>` : ""}
            ${notes}
          </div>`;
      }

      // sources
      const sourcesHTML = (t.sources || []).map(s =>
        s.url
          ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="font-size:0.78rem;color:#60a5fa;text-decoration:none">${esc(s.name)}</a>`
          : `<span class="field-value">${esc(s.name)}</span>`
      ).join("  ");

      return `
        <div class="detail-meta">
          <span class="badge badge-type">${esc(t.tool_type)}</span>
          <span class="badge badge-status${statusCls}">${esc(t.status)}</span>
        </div>
        <div class="detail-name">${esc(t.name)}</div>
        ${t.description ? `<div class="detail-desc">${esc(t.description)}</div>` : ""}
        ${links ? `<div class="detail-links">${links}</div>` : ""}

        ${nafBadges ? `
        <div class="detail-section">
          <h3>NAF Functions</h3>
          <div class="badge-tags">${nafBadges}</div>
        </div>` : ""}

        ${catBadges ? `
        <div class="detail-section">
          <h3>Categories</h3>
          <div class="badge-tags">${catBadges}</div>
        </div>` : ""}

        <div class="detail-section">
          <h3>Details</h3>
          ${t.business_model ? `<div class="detail-field"><span class="field-label">Business model</span><span class="field-value">${esc(t.business_model)}</span></div>` : ""}
          ${t.license        ? `<div class="detail-field"><span class="field-label">License</span><span class="field-value">${esc(t.license)}</span></div>` : ""}
        </div>

        ${capsHTML ? `
        <div class="detail-section">
          <h3>Capabilities</h3>
          ${capsHTML}
        </div>` : ""}

        ${sourcesHTML ? `
        <div class="detail-section">
          <h3>Sources</h3>
          <div style="display:flex;flex-wrap:wrap;gap:8px">${sourcesHTML}</div>
        </div>` : ""}
      `;
    }

    // ── init ─────────────────────────────────────────────────────────────
    async function init() {
      try {
        const tools  = await fetchAllTools();
        const groups = groupByFunction(tools);
        for (const fn of NAF_FUNCTIONS) renderGroup(fn, groups[fn]);
      } catch (err) {
        console.error("Failed to load tools:", err);
        for (const fn of NAF_FUNCTIONS) {
          const el = document.getElementById(`tools-${fn}`);
          if (el) el.innerHTML = '<div class="tool-loading">error</div>';
        }
      }
    }

    init();
  </script>

</body>
</html>
